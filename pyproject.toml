[project]
name = "sorveteagent"
version = "1.0.0"
description = "Agente de previsão de vendas de sorvete e plano de produção, com dashboard e avaliação contra gabarito."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5", "holidays>=0.50",
  "plotly>=5.20", "mlflow-skinny>=2.10", "streamlit>=1.35", "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
